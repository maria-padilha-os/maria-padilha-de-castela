# Pacman configuration for the reference build.
#
# The build host must have a current Arch mirrorlist at
# /etc/pacman.d/mirrorlist and the BlackArch mirrorlist at
# /etc/pacman.d/blackarch-mirrorlist. The BlackArch keyring is installed from
# the [blackarch] repository and populated before packages are installed.
#
# Signature policy is intentionally strict. Never replace this with TrustAll or
# SigLevel = Never.

[options]
HoldPkg = pacman glibc
Architecture = auto
Color
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[blackarch]
Include = /etc/pacman.d/blackarch-mirrorlist
SigLevel = Required DatabaseOptional
