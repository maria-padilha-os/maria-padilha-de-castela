# Calamares packagechooser: authorized security tool groups.
#
# AUTHORIZED USE ONLY. The installer may add tool packages to an owned system
# or to a system for which the operator holds explicit, written permission.
# Selecting a group installs packages only: nothing here starts a service,
# scanner, packet capture, target discovery, or scheduled job.
#
# Method "packages" hands the selected package lists to the Calamares
# "packages" module, which runs after unpackfs. No group is selected by
# default. The mandatory core is part of packages.x86_64 and is always
# installed from the image; the core item is shown for transparency.
#
# Optional groups need network access (or a complete local package cache)
# during the install. If there is no network, packages.conf skips optional
# installs and the mandatory core still installs offline.
---
mode: optionalmultiple
method: packages

labels:
  step: "Security tool groups"

items:
  - id: ""
    name: "Core image only (no optional groups)"
    description: >-
      AUTHORIZED USE ONLY. Use this image only on systems you own or for which
      you have explicit, written permission to test. No optional group is
      selected by default, and no scanner, capture, target discovery, or service
      starts during installation or first boot.

      With no optional group selected, the installer provides the mandatory core
      image only. Select one or more reviewed groups below to add packages;
      selecting a group installs packages and does not run them or configure
      them to start automatically.
  - id: core
    name: "Core (mandatory)"
    description: >-
      Mandatory base image, Calamares installer, Hyprland/Quickshell desktop,
      Arch and BlackArch keyrings, and the small reviewed network/forensics/lab
      baseline. Core packages are listed in packages.x86_64 and are always
      installed from the image; they cannot be removed by deselecting this
      item. Authorized use only: use the installed system only on owned assets
      or with explicit, written permission.
    packages:
      - base
      - linux
      - linux-firmware
      - intel-ucode
      - amd-ucode
      - mkinitcpio-archiso
      - squashfs-tools
      - syslinux
      - zstd
      - networkmanager
      - nftables
      - wpa_supplicant
      - wireless-regdb
      - iw
      - hyprland
      - quickshell
      - qt6-base
      - qt6-declarative
      - qt6-wayland
      - polkit
      - polkit-gnome
      - gnome-keyring
      - greetd
      - greetd-tuigreet
      - maria-padilha
      - calamares
      - archlinux-keyring
      - blackarch-keyring
      - blackarch-mirrorlist
      - nmap
      - wireshark-qt
      - tcpdump
      - sleuthkit
      - testdisk
      - qemu-desktop
      - libvirt
      - virt-manager
      - edk2-ovmf
      - firejail
  - id: recon
    name: "Recon"
    description: >-
      Network and service reconnaissance for an explicitly scoped assessment.
      Installs tools only; it does not scan, enumerate, discover targets, or
      start a listener. Authorized use only: select this group only when you own
      the target networks or hold explicit, written permission that names the
      scope and time window.
    packages:
      - nmap
      - masscan
      - dnsrecon
      - whois
      - traceroute
      - arp-scan
      - amass
      - nikto
      - theharvester
      - dnsenum
  - id: web
    name: "Web"
    description: >-
      Web application assessment and content discovery for owned or authorized
      applications. Installs tools only; it does not crawl, request, or scan a
      site until the operator starts a tool with an explicit target. Authorized
      use only: third-party sites and bug-bounty programs remain out of scope
      unless their written rules and your authorization cover the activity.
    packages:
      - nikto
      - gobuster
      - ffuf
      - dirb
      - whatweb
      - sqlmap
      - wfuzz
      - nuclei
      - mitmproxy
  - id: wireless
    name: "Wireless"
    description: >-
      Wireless assessment and capture analysis for owned or authorized radio
      environments. Installs tools only; it does not put an interface into
      monitor mode, start a capture, transmit, or deauthenticate anything.
      Authorized use only: radio regulations and the written target scope apply,
      and third-party networks are out of scope.
    packages:
      - aircrack-ng
      - reaver
      - bully
      - kismet
      - wifite
      - hcxtools
      - hcxdumptool
      - pixiewps
      - cowpatty
      - mdk4
  - id: forensics
    name: "Forensics"
    description: >-
      Disk, file-system, memory, and metadata analysis for incident response and
      authorized examinations. Installs tools only; it does not mount, image,
      erase, or modify a device until the operator chooses a source explicitly.
      Authorized use only: acquire and analyze only media you own or are
      authorized in writing to examine.
    packages:
      - sleuthkit
      - testdisk
      - ddrescue
      - binwalk
      - foremost
      - scalpel
      - guymager
      - exiftool
      - volatility3
      - autopsy
  - id: reversing
    name: "Reversing"
    description: >-
      Static and dynamic analysis of binaries and application packages for
      authorized research and malware triage. Installs tools only; it does not
      execute, unpack, or attach to a process automatically. Authorized use
      only: analyze only software you own or are authorized in writing to
      examine, and respect the software's license terms.
    packages:
      - radare2
      - rizin
      - ghidra
      - gdb
      - binutils
      - ltrace
      - strace
      - jadx
      - apktool
      - upx
  - id: password-auditing
    name: "Password Auditing"
    description: >-
      Offline password-strength and hash auditing for credentials you own or are
      authorized to test. Installs offline analysis tools only; it does not
      capture credentials, attack a login service, or start a cracking job.
      Network login brute-force and credential-dumping tools are not included.
      Authorized use only: never audit another person's credentials.
    packages:
      - john
      - hashcat
      - hashcat-utils
      - crunch
      - ophcrack
      - fcrackzip
      - pdfcrack
      - hashid
  - id: lab-vm
    name: "Lab/VM tools"
    description: >-
      Isolated virtual machines, local containers, and network namespaces for
      containing authorized lab work. Installs tools only; it does not enable or
      start libvirtd, create a bridge, or run a VM. Authorized use only: keep
      destructive or dual-use testing inside a lab you own and control.
    packages:
      - qemu-desktop
      - libvirt
      - virt-manager
      - edk2-ovmf
      - firejail
      - libguestfs
      - dnsmasq
      - nftables
      - podman
