LABEL arch
TEXT HELP
Boot the private Maria Padilha de Castela live image on BIOS.
It starts the Hyprland + Quickshell session as the unprivileged maria user.
Nothing scans or captures automatically.
ENDTEXT
MENU LABEL Maria Padilha de Castela (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
