# Authorized-use notice shown by Calamares before installation.
---
notes: |
    <h3>AUTHORIZED USE ONLY</h3>
    <p>Use this image only on owned systems or on systems for which you have
    explicit, written permission to test. Unauthorized access, scanning of
    third-party systems, phishing, and credential theft are prohibited and may
    be illegal.</p>
    <p>No scans run by default. Define an explicit target scope before running
    any tool, and stop and clear the scope when you are done.</p>
    <p>The full boundary is documented in the project at
    <code>docs/policy/authorized-use.md</code>.</p>
