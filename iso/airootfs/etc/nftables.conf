#!/usr/sbin/nft -f
#
# Maria Padilha de Castela: default-deny inbound firewall.
#
# This is the only firewall policy shipped in the image. It is loaded by
# nftables.service at boot. New inbound connections are dropped by default;
# the operator must add an explicit, reviewed rule before any service becomes
# reachable. No port-forwarding or NAT is configured.
#
# The live image is not a router. Forwarding is dropped, and output is
# unrestricted so that explicitly started tools and package installs can work.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback is local only.
        iifname "lo" accept

        # Replies to connections this host initiated, and related ICMP errors.
        ct state established,related accept
        ct state invalid drop

        # DHCP client replies. These are replies to a client request, not a
        # listening service; no DHCP server is run on this image.
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # Path-MTU and other ICMP error messages needed by established flows.
        # Inbound echo requests are deliberately not accepted.
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        ip6 nexthdr ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept

        # Everything else is a new inbound connection: deny it.
        counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
