# Calamares sequence for the reference build.
#
# Module-specific configuration (partition, mount, unpackfs, bootloader, users,
# etc.) is supplied by the Calamares package and the maria-padilha-de desktop
# overlay. This file only fixes the sequence and the security branding. Validate
# an offline install in a VM before signing any artifact.
#
# The packagechooser step offers the mandatory core and the optional authorized
# security tool groups. It records only the selection; the packages module
# installs it after unpackfs. No optional group is selected by default and no
# step starts a scanner or service.

---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: welcome
    module: welcome
    config: welcome.conf
  - id: notes
    module: notes
    config: notes.conf
  - id: packagechooser
    module: packagechooser
    config: packagechooser.conf

sequence:
  - show:
      - welcome
      - notes
      - packagechooser
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - packages
      - machineid
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - bootloader
      - umount
  - show:
      - finished

branding: maria-padilha
prompt-install: false
dont-chroot: false
