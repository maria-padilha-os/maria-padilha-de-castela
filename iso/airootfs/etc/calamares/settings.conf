# Calamares sequence for the private Maria Padilha de Castela build.
#
# The installer offers the mandatory core plus optional authorized security tool
# groups (packagechooser.conf). The packagechooser step only records the
# selection; the packages module installs it after unpackfs. No optional group
# is selected by default and no Calamares step starts a scanner or service.
#
# Module-specific configuration for partition, mount, unpackfs, bootloader,
# users, and similar modules is supplied by the Calamares package and the
# maria-padilha-de desktop overlay. Validate an offline install in a VM before
# signing any artifact.

---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: welcome
    module: welcome
    config: welcome.conf
  - id: notes
    module: notes
    config: notes.conf
  - id: packagechooser
    module: packagechooser
    config: packagechooser.conf

sequence:
  - show:
      - welcome
      - notes
      - packagechooser
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - packages
      - machineid
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - bootloader
      - umount
  - show:
      - finished

branding: maria-padilha
prompt-install: false
dont-chroot: false
