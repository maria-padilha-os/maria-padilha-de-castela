# Calamares package installation for the private Maria Padilha de Castela
# image.
#
# The packagechooser module supplies the selected security tool groups through
# GlobalStorage; this module then installs those packages with pacman inside the
# target. The mandatory core already comes from the archiso root, so an offline
# install remains possible: optional groups are skipped when no network is
# available instead of failing the install.
---
backend: pacman

# Offline behavior: keep the core install working without network access.
skip_if_no_internet: true
update_db: true
update_system: false

pacman:
  num_retries: 3
  disable_download_timeout: false
  needed_only: true

# No unconditional package operations. Every additional package comes from the
# packagechooser selection, so no optional group or service is installed by
# default.
operations: []
