#
# pacman.conf for the private Maria Padilha de Castela archiso profile.
#
# Package sources are pinned here instead of inheriting a host mirrorlist.
# Arch is pinned to a dated archive snapshot; BlackArch is pinned to its
# official repository endpoint. Repository signatures are mandatory. Never
# relax or disable signature checking.
#
# The keyring packages (archlinux-keyring and blackarch-keyring) are listed in
# packages.x86_64. Their pinned versions and verification policy live in
# keys/trusted-keyrings.txt. No private key material belongs in this tree.
#

[options]
HoldPkg     = pacman glibc
Architecture = x86_64
Color
ParallelDownloads = 5
# CheckSpace is disabled because pacstrap runs inside a chroot where the check
# cannot see the target filesystem reliably.
#CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://archive.archlinux.org/repos/2026/11/01/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/11/01/$repo/os/$arch

[blackarch]
Server = https://blackarch.org/blackarch/$repo/os/$arch
SigLevel = Required DatabaseOptional

# Testing and multilib repositories are intentionally disabled. Add them only
# through a reviewed change to this file and the package allowlist.
