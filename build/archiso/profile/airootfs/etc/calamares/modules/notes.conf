# Authorized-use notice shown by Calamares before installation.
---
notes: |
    <h3>AUTHORIZED USE ONLY</h3>
    <p>Use this image only on owned systems or on systems for which you have
    explicit, written permission to test. Unauthorized access, scanning of
    third-party systems, phishing, and credential theft are prohibited and may
    be illegal.</p>
    <p>No scans run by default. Define an explicit target scope before running
    any tool, and stop and clear the scope when you are done.</p>
    <h3>Security tool groups</h3>
    <p>The installer offers a mandatory core and optional groups: Recon, Web,
    Wireless, Forensics, Reversing, Password Auditing, and Lab/VM tools. No
    optional group is selected by default. Selecting a group installs packages
    only; it does not start a service, scanner, capture, or target discovery.
    Optional groups need network access or a local package cache. An offline
    install receives the core image.</p>
    <p>Only packages that may be redistributed are offered. Proprietary or
    unclear-license tools (for example Burp Suite Professional, Nessus, IDA Pro,
    or Metasploit Pro) are not shipped; install such tools yourself under the
    vendor's terms.</p>
    <p>The full boundary is documented in the project at
    <code>docs/policy/authorized-use.md</code> and
    <code>docs/policy/security-tool-groups.md</code>.</p>
